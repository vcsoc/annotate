[package]
name = "annotate"
version = "1.0.0"
edition = "2021"
description = "Annotate Console: harness-agnostic screenshot annotations for AI coding agents and desktop apps"
default-run = "annotate"

[[bin]]
name = "annotate"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.7"
arboard = { version = "3", features = ["wayland-data-control"] }
enigo = "0.5"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json"] }
getrandom = "0.2"
dirs = "6"
which = "7"
tokio = { version = "1", features = ["time", "sync", "process", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
toml_edit = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
